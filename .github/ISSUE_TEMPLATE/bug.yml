name: Bug report
description: Report a reproducible product or translation problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please use private vulnerability reporting for security issues. Do not disclose them here.
  - type: input
    id: version
    attributes:
      label: RepoLingo and browser versions
      placeholder: RepoLingo 0.1.0 / Chrome 138
    validations:
      required: true
  - type: dropdown
    id: page
    attributes:
      label: GitHub page type
      options: [README, Issue, Pull Request, Discussion, Release, Settings or popup]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and translation (required for translation errors)
      description: Remove API keys, private-repository content, and personal information.
