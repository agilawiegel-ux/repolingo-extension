name: Feature request
description: Propose a focused, lightweight capability
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: Explain what is difficult today and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Package-size, privacy, permission, and translation-quality impact
    validations:
      required: true
